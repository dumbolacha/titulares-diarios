name: Actualizar titulares

on:
  schedule:
  - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Descargar feeds y generar noticias
        run: |
          javac LectorRSS.java
          java LectorRSS config.properties

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "actualizador-automatico"
          git config user.email "actualizador@users.noreply.github.com"
          git add noticias.js noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar titulares"
            git push
          fi
