<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Titulares del día</title>
  <script src="noticias.js"></script>
  <style>
    :root {
      --bg: #f6f5f2; --card: #ffffff; --texto: #1d1d1b; --suave: #6b6a65;
      --linea: #e3e1dc; --acento: #1f5fbf; --ok: #2e7d4f; --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161614; --card: #22221f; --texto: #f2f1ed; --suave: #a3a19a;
        --linea: #34342f; --acento: #7aa7ff; --ok: #6fcf97; --error: #ff8a80;
      }
    }
    :root[data-theme="dark"] {
      --bg: #161614; --card: #22221f; --texto: #f2f1ed; --suave: #a3a19a;
      --linea: #34342f; --acento: #7aa7ff; --ok: #6fcf97; --error: #ff8a80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--texto);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
    header h1 { margin: 0 0 4px; font-size: 1.8rem; }
    header p { margin: 0; color: var(--suave); font-size: .9rem; }
    h2 { font-size: 1.15rem; margin: 32px 0 12px; border-bottom: 1px solid var(--linea); padding-bottom: 6px; }
    .card {
      background: var(--card); border: 1px solid var(--linea);
      border-radius: 10px; padding: 14px 16px; margin-bottom: 12px;
    }
    .card a.titulo { color: var(--texto); text-decoration: none; font-weight: 600; }
    .card a.titulo:hover { color: var(--acento); text-decoration: underline; }
    .meta { color: var(--suave); font-size: .85rem; margin-top: 4px; }
    .chip {
      display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--linea); color: var(--suave); margin-right: 6px;
    }
    .chip.destacado { background: var(--acento); border-color: var(--acento); color: #fff; }
    ul.versiones { margin: 10px 0 0; padding-left: 18px; font-size: .92rem; }
    ul.versiones li { margin-bottom: 4px; }
    ul.versiones a { color: var(--acento); }
    .feed { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--linea); font-size: .92rem; }
    .feed:last-child { border-bottom: none; }
    .ok { color: var(--ok); }
    .fallo { color: var(--error); }
    .aviso { background: var(--card); border: 1px solid var(--error); padding: 16px; border-radius: 10px; color: var(--error); }
    footer { margin-top: 40px; color: var(--suave); font-size: .8rem; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Titulares del día</h1>
    <p id="actualizado"></p>
  </header>

  <div id="contenido"></div>

  <footer>
    Solo se muestran titulares y enlaces a cada medio. Los contenidos pertenecen a sus respectivos diarios.
  </footer>
</main>

<script>
(function () {
  const contenido = document.getElementById("contenido");
  const actualizado = document.getElementById("actualizado");

  function fmtHora(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleString("es-ES", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  function el(tag, attrs, texto) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (texto !== undefined && texto !== null) e.textContent = texto;
    return e;
  }

  function enlaceTitulo(titulo, enlace) {
    const a = el("a", { class: "titulo", href: enlace || "#", target: "_blank", rel: "noopener" }, titulo);
    return a;
  }

  function seccion(titulo) {
    contenido.appendChild(el("h2", null, titulo));
  }

  if (!window.NOTICIAS) {
    contenido.appendChild(el("div", { class: "aviso" },
      "No se encontró noticias.js. Ejecuta LectorRSS primero, en la misma carpeta que esta página."));
    return;
  }

  const datos = window.NOTICIAS;
  actualizado.textContent = "Actualizado: " + fmtHora(datos.actualizado);

  // 1. Última hora
  seccion("Última hora");
  (datos.ultimaHora || []).forEach(function (n) {
    const card = el("div", { class: "card" });
    card.appendChild(enlaceTitulo(n.titulo, n.enlace));
    const meta = el("div", { class: "meta" });
    meta.appendChild(el("span", { class: "chip" }, n.fuente));
    meta.appendChild(document.createTextNode(fmtHora(n.fecha)));
    card.appendChild(meta);
    contenido.appendChild(card);
  });

  // 2. Historias con más fuentes
  seccion("Lo más cubierto");
  (datos.historias || []).forEach(function (h) {
    const card = el("div", { class: "card" });
    const cabecera = el("div");
    cabecera.appendChild(el("span", { class: "chip destacado" },
      h.numFuentes + (h.numFuentes === 1 ? " fuente" : " fuentes")));
    cabecera.appendChild(enlaceTitulo(h.titulo, h.enlace));
    card.appendChild(cabecera);

    if (h.versiones && h.versiones.length > 1) {
      const ul = el("ul", { class: "versiones" });
      h.versiones.forEach(function (v) {
        const li = el("li");
        li.appendChild(el("strong", null, v.fuente + ": "));
        const a = el("a", { href: v.enlace || "#", target: "_blank", rel: "noopener" }, v.titulo);
        li.appendChild(a);
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }
    contenido.appendChild(card);
  });

  // 3. Estado de los feeds
  seccion("Fuentes");
  const estado = el("div", { class: "card" });
  (datos.feeds || []).forEach(function (f) {
    const fila = el("div", { class: "feed" });
    fila.appendChild(el("span", null, f.nombre));
    if (f.error) {
      fila.appendChild(el("span", { class: "fallo" }, "Error: " + f.error));
    } else {
      fila.appendChild(el("span", { class: "ok" }, f.titulares + " titulares"));
    }
    estado.appendChild(fila);
  });
  contenido.appendChild(estado);
})();
</script>
</body>
</html>
